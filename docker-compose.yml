services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/alone_account.sqlite3
      PAYMENT_CALLBACK_BIND: 0.0.0.0
    volumes:
      - bot-data:/app/data
    ports:
      - "127.0.0.1:${PAYMENT_CALLBACK_PORT:-8787}:${PAYMENT_CALLBACK_PORT:-8787}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
